spring.application.name=assignment_jkTech
spring.datasource.url=jdbc:mysql://localhost:3306/balu
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.format_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=INFO
logging.level.org.springframework.jdbc.datasource=DEBUG
server.port=8081
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect  # MySQL dialect
spring.task.execution.pool.size=10
springfox.documentation.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.main.allow-bean-definition-overriding=true
